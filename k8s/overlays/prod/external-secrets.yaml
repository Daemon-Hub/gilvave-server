apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: gilvave
spec:
  provider:
    vault:
      server: "https://vault.gilvave.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "gilvave-server-role"
          serviceAccountRef:
            name: default

---
# Основные секреты приложения
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: infra-secrets-sync
  namespace: gilvave
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: infra-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: gilvave/production/backend

---
# PostgreSQL
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-user-secret-sync
  namespace: gilvave
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: postgres-user-secret
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: gilvave/production/postgres
        property: POSTGRES_USER
    - secretKey: password
      remoteRef:
        key: gilvave/production/postgres
        property: POSTGRES_PASSWORD

---
# SeaweedFS
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-secrets-sync
  namespace: gilvave
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: seaweedfs-s3-secrets
  data:
    - secretKey: ACCESS_KEY
      remoteRef:
        key: gilvave/production/s3
        property: S3_ACCESS_KEY
    - secretKey: SECRET_KEY
      remoteRef:
        key: gilvave/production/s3
        property: S3_SECRET_KEY
