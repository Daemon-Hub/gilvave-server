apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gilvave

resources:
  - ../../base
  - external-secrets.yaml

# Патчи для прода: 3 инстанса (кворум против split-brain) и архивация в S3
patches:
  - target:
      kind: Cluster
      name: postgres
    patch: |-
      - op: replace
        path: /spec/instances
        value: 3
      - op: replace
        path: /spec/bootstrap/initdb/database
        value: "gilvave_db"
      - op: replace
        path: /spec/bootstrap/initdb/owner
        value: "gilvave"
      - op: add
        path: /spec/backup
        value:
          retentionPolicy: "30d"
          barmanObjectStore:
            destinationPath: "s3://gilvave-backups-prod/postgres/"
            endpointURL: "https://s3.prod.gilvave.internal"
            s3Credentials:
              accessKeyId:
                name: seaweedfs-s3-secrets
                key: ACCESS_KEY
              secretAccessKey:
                name: seaweedfs-s3-secrets
                key: SECRET_KEY
            wal:
              compression: gzip
              maxParallel: 4
